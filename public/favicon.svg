<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00afca"/>
      <stop offset="100%" stop-color="#007799"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#fec400"/>
      <stop offset="100%" stop-color="#d49b00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle / Shield -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#fec400" stroke-width="2"/>
  
  <!-- Sun with Rays -->
  <g filter="url(#glow)">
    <circle cx="32" cy="24" r="7.5" fill="url(#gold)"/>
    <!-- 16 primary rays around the sun -->
    <path d="
      M32 11.5 L33.2 14.5 L30.8 14.5 Z
      M32 36.5 L33.2 33.5 L30.8 33.5 Z
      M19.5 24 L22.5 25.2 L22.5 22.8 Z
      M44.5 24 L41.5 25.2 L41.5 22.8 Z
      M23.2 15.2 L25.8 17.2 L24.2 18.8 Z
      M40.8 32.8 L38.2 30.8 L39.8 29.2 Z
      M40.8 15.2 L39.8 18.8 L38.2 17.2 Z
      M23.2 32.8 L24.2 29.2 L25.8 30.8 Z
      M26.5 12.5 L28.2 15.2 L26.2 16.2 Z
      M37.5 35.5 L35.8 32.8 L37.8 31.8 Z
      M37.5 12.5 L37.8 16.2 L35.8 15.2 Z
      M26.5 35.5 L26.2 31.8 L28.2 32.8 Z
      M14.5 28.5 L17.2 28.2 L16.2 30.2 Z
      M49.5 19.5 L46.8 19.8 L47.8 17.8 Z
      M14.5 19.5 L16.2 17.8 L17.2 19.8 Z
      M49.5 28.5 L47.8 30.2 L46.8 28.2 Z
    " fill="url(#gold)"/>
    
    <!-- Steppe Eagle beneath the sun -->
    <path d="M32 37.5 C26 34.5 18 36.5 14 42 C20 40 27 40.5 32 44.5 C37 40.5 44 40 50 42 C46 36.5 38 34.5 32 37.5 Z" fill="url(#gold)"/>
    <path d="M32 35 C33.5 36.5 33 38 32 39 C31 38 30.5 36.5 32 35 Z" fill="url(#gold)"/>
  </g>
</svg>